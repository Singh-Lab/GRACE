# GRACE benchmark task -- published configuration.
# K, steps, lr and rho reproduce the paper; change them on the command
# line with --K/--steps/--lr/--rho to explore other settings.
key: rna_toehold
title: Toehold switch
domain: rna
runner: generic
alphabet: ACGU
target_sign: 1.0
length: 30
K: 8
steps: 500
lr: 0.2
rho: 10.0
target:
  name: ON-state output
  oracle: target_oracle.pt
  units: normalised 0-1, higher is better
constraints:
- name: OFF-state leakage
  oracle: constraint_oracle.pt
  eps: 0.02
  units: normalised 0-1
active_set_tol: 0.3
dual_lr: 0.05
